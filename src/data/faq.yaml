# שאלות נפוצות – מהאתר הקיים (נכנסות גם לנתונים המובנים של גוגל)
- q: האם צריך ניסיון קודם?
  a: ממש לא. רוב המתאמנים שלנו התחילו בלי שום ניסיון. כל מה שצריך זה רצון להתחיל.
# TODO: סתירת גילאים – כאן "מגיל 5", במסך הפתיחה ובסקשן הילדים "גיל 4"
- q: באילו גילאים אפשר להתחיל?
  a: מגיל 5 ומעלה. יש קבוצות נפרדות לילדים, נוער ובוגרים. תמיד אפשר ליצור קשר ואנחנו נכוון לקבוצה המתאימה.
- q: האם אפשר להגיע לשיעור ניסיון?
  a: בהחלט. אנחנו מזמינים כל אחד לאימון ניסיון. פשוט שלחו לנו הודעה ונתאם זמן נוח.
- q: האם צריך ציוד?
  a: לאימון ניסיון – לא. בגדי ספורט נוחים מספיקים. לאחר מכן ננחה אתכם בנוגע לציוד הנדרש.
- q: איפה המועדון נמצא?
  a: המועדון נמצא בקיבוץ גונן, הגליל העליון. לכתובת המדויקת ולשעות הפעילות – שלחו לנו הודעה בוואטסאפ.
