eyebrow: ילדים
title: אומנויות לחימה לילדים
paragraphs:
  - "האימונים לילדים משלבים **ג'יו ג'יטסו ברזילאי, ג'ודו וקיקבוקסינג** בצורה שמתאימה לגיל הצעיר. המטרה היא לחשוף את הילדים לעולם עשיר של תנועה, שליטה בגוף וביטחון עצמי."
  - מעבר לטכניקות הלחימה עצמן, יש במועדון תוכנית התקדמות ייחודית שמפתחת גם את הצד המנטלי והערכי.
  # TODO: סתירת גילאים – "גיל 4" כאן ובמסך הפתיחה, "מגיל 5" בשאלות הנפוצות
  - "**האימונים מחולקים לפי קבוצות גיל** – כל ילד מתאמן עם בני גילו. גיל 4 לא מתאמן עם גיל 12."
valuesTitle: מה לוקחים מהמזרן
# icon: discipline | respect | control | challenge | confidence
values:
  - label: משמעת והתמדה
    icon: discipline
  - label: כבוד לעצמם ולאחרים
    icon: respect
  - label: שליטה עצמית
    icon: control
  - label: התמודדות עם אתגרים
    icon: challenge
  - label: ביטחון עצמי
    icon: confidence
note: "הדגש הוא על תהליך – **לא רק על טכניקה**. הילדים מקבלים כלים שילוו אותם גם מחוץ למזרן."
parentsTitle: להורים – מה חשוב לדעת
# icon: groups | start | trial | shield
parents:
  - title: קבוצות לפי גיל
    text: כל ילד מתאמן עם בני גילו – גיל 4 לא מתאמן עם גיל 12.
    icon: groups
  - title: לא צריך ניסיון קודם
    text: רוב המתאמנים שלנו התחילו בלי שום ניסיון. כל מה שצריך זה רצון להתחיל.
    icon: start
  - title: אימון ניסיון ללא התחייבות
    text: לאימון ניסיון לא צריך ציוד – בגדי ספורט נוחים מספיקים.
    icon: trial
  - title: בטיחות באימון
    text: קרבות אימון רק עם ציוד מגן – קסדה, מגני שוקיים וכפפות – על מזרנים ותחת השגחה צמודה.
    icon: shield
