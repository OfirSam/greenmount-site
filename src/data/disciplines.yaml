# ─────────────────────────────────────────────
#  תחומי אימון לנוער ולבוגרים – הטקסטים הקצרים מהאתר הקיים
#  id = מזהה (גם להודעת הוואטסאפ ב-src/config/site.ts) – לא לשנות
#  image = שם קובץ בתוך assets/images/disciplines/ (ריק = כרטיס מעוצב ללא תמונה)
#  details = מוצג בחלון "לפרטים נוספים"
# ─────────────────────────────────────────────
- id: muay-thai
  name: איגרוף תאילנדי / קיקבוקסינג
  latin: MUAY THAI
  image: muay-thai.jpg
  imageAlt: קרב אימון באיגרוף בזירת GREENMOUNT
  short: אימון שמפתח כוח, מהירות וסיבולת דרך עבודה עם אגרופים, בעיטות והגנות. האימונים משלבים עבודה על שקי אגרוף, תרגול בזוגות וכושר גופני גבוה.
  details:
    - label: למי זה מתאים
      text: "לנוער ולבוגרים – מתחילים ומתקדמים. מתאים גם למי שמחפש אימון כושר אינטנסיבי בלי להיכנס לקרבות."
    - label: איך נראה אימון
      text: "חימום וקפיצה בחבל, טכניקה של אגרופים, בעיטות וברכיים, תרגול בזוגות על כריות אימון ובסיום – כושר וחיזוק. למי שרוצה ומוכן: קרבות אימון מבוקרים עם ציוד מגן."
    - label: מה צריך להביא
      text: "לאימון ניסיון – בגדי ספורט נוחים מספיקים. לאחר מכן ננחה אתכם בנוגע לציוד הנדרש."

