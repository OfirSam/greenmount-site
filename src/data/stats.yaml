# ─────────────────────────────────────────────
#  פס האמון – מספרים עם אנימציית ספירה
#  value = המספר | prefix/suffix = תוספות (למשל +) | label = הטקסט מתחת
#  todo: true = מספר זמני – לא מוצג באתר עד שמשנים ל-false
# ─────────────────────────────────────────────
- value: 6
  label: תחומי אימון לנוער ולבוגרים

- value: 3
  label: מסלולים – ילדים, נוער ובוגרים

- value: 0
  label: ניסיון קודם נדרש

- value: 1
  label: אימון ניסיון – ללא התחייבות

# להוספה כשיש מספרים אמיתיים (ולשנות todo ל-false):
- value: 0
  suffix: "+"
  label: שנות ניסיון באומנויות לחימה
  todo: true
- value: 0
  suffix: "+"
  label: מתאמנים ומתאמנות
  todo: true
