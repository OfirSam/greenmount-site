# ─────────────────────────────────────────────
#  פס האמון – מספרים עם אנימציית ספירה
#  value = המספר | prefix/suffix = תוספות (למשל +) | label = הטקסט מתחת
#  todo: true = לא מוצג באתר עד שמשנים ל-false
#  הפס מסתדר אוטומטית לפי מספר הפריטים (3 או 4 מומלץ)
# ─────────────────────────────────────────────
- value: 200
  suffix: "+"
  label: תלמידים
- value: 6
  label: תחומי אימון לנוער ולבוגרים
- value: 3
  label: מסלולים – ילדים, נוער ובוגרים

# להוסיף כשיש מספר אמיתי (ולשנות todo ל-false):
- value: 0
  suffix: "+"
  label: שנות ניסיון באומנויות לחימה
  todo: true
