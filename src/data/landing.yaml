  h1: "MMA בגליל העליון"
  lead: "שילוב של אומנויות לחימה מהעמידה ומהקרקע. האימון מחבר בין אגרופים, בעיטות, הורדות לקרקע ושליטה במצבים שונים."
  image: { folder: gallery, file: 04-adult-sparring.jpg, alt: "קרב אימון בזירת GREENMOUNT בקיבוץ גונן" }
  facts:
    - { label: "גילאים", text: "נוער מגיל 12 ובוגרים מגיל 18" }
    - { label: "רמה", text: "מתחילים ומתקדמים – בלי ניסיון קודם" }
    - { label: "מה להביא", text: "לאימון ניסיון – בגדי ספורט נוחים" }
  sections:
    - heading: "מה זה MMA?"
      paragraphs:
        - "MMA – Mixed Martial Arts, או בעברית אומנויות לחימה מעורבות – מחבר כמה אומנויות לחימה לשיטה אחת שלמה. העבודה מהעמידה מגיעה מעולם הקיקבוקסינג והאיגרוף התאילנדי, ההטלות וההורדות לקרקע מהג'ודו וההיאבקות, והעבודה על הקרקע – מהג'יו ג'יטסו הברזילאי."
        - "התוצאה היא אימון מגוון ומאתגר שמפתח כושר, כוח, קואורדינציה וביטחון עצמי – ומלמד להרגיש בנוח בכל מצב."
