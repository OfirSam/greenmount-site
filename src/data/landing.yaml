- slug: mma
  navLabel: MMA
  wa: mma
  discipline: mma
  title: "MMA בגליל העליון – אימוני MMA בקיבוץ גונן | GREENMOUNT"
  description: "אימוני MMA לנוער ולבוגרים בקיבוץ גונן, הגליל העליון: עבודת עמידה, הורדות וקרקע תחת קורת גג אחת. לא צריך ניסיון קודם – קבעו אימון ניסיון ללא התחייבות."
