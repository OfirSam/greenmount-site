      paragraphs:
        - "כל אימון משלב טכניקה, תרגול מצבים בזוגות וכושר קרבי, ובנוי כך שמתחילים ומתקדמים מתאמנים יחד – כל אחד ברמה שלו."
      bullets:
        - "חימום וכושר קרבי"
        - "עבודת עמידה – אגרופים, בעיטות והגנות"
        - "הורדות לקרקע והגנה מהן"
        - "שליטה ועבודה מהקרקע"
        - "תרגול מצבים בזוגות"
    - heading: "למי זה מתאים"
      paragraphs:
        - "אימוני ה-MMA מיועדים לנוער מגיל 12 ולבוגרים – ממתחילים לגמרי ועד מתאמנים עם רקע. מי שכבר מתאמן בתחום אחד, כמו קיקבוקסינג או ג'יו ג'יטסו, ימצא ב-MMA את החיבור בין העולמות."
    - heading: "MMA בגליל – קרוב לבית"
      paragraphs:
        - "GREENMOUNT נמצא בקיבוץ גונן שבעמק החולה, בלב הגליל העליון וקרוב לקריית שמונה. לא צריך לנסוע למרכז כדי להתאמן ב-MMA – המזרן מחכה כאן, בגליל."
  faq:
    - q: "האם צריך ניסיון קודם כדי להתחיל MMA?"
      a: "ממש לא. רוב המתאמנים שלנו התחילו בלי שום ניסיון. כל מה שצריך זה רצון להתחיל."
    - q: "מאיזה גיל אפשר להתאמן ב-MMA?"
      a: "קבוצות הנוער פתוחות מגיל 12 וקבוצות הבוגרים מגיל 18. לילדים צעירים יותר יש תוכנית ילדים נפרדת שמשלבת ג'יו ג'יטסו, ג'ודו וקיקבוקסינג."
    - q: "מה ההבדל בין MMA לקיקבוקסינג?"
      a: "בקיקבוקסינג עובדים מהעמידה – אגרופים, בעיטות והגנות. ב-MMA מוסיפים הורדות לקרקע ועבודה על הקרקע, כך שהאימון מכסה את כל מצבי הקרב."
    - q: "מה צריך להביא לאימון ניסיון?"
      a: "לאימון ניסיון – בגדי ספורט נוחים מספיקים. לאחר מכן ננחה אתכם בנוגע לציוד הנדרש."

