eyebrow: ראש המועדון
name: נטע גרינברג
nameLatin: NETA GREENBERG
role: GREENMOUNT · קיבוץ גונן
lead: הקמתי את GREENMOUNT כדי שיהיה בגליל מקום אחד שבו ילדים, נוער ובוגרים לומדים אומנויות לחימה ברצינות – באווירה של בית.
bio:
  - אומנויות לחימה לימדו אותי שהדרך חשובה לא פחות מהיעד. כל אימון הוא עוד צעד קדימה – בגוף, בביטחון ובראש.
  - על המזרן עובדים על טכניקה, כושר ומשמעת – אבל לא פחות מזה על כבוד, התמדה וביטחון עצמי. אלה הדברים שלוקחים איתם החוצה, לבית הספר, לעבודה ולחיים.
  - את מה שלמדתי לאורך השנים, במזרנים ובמחנות אימון, הבאתי הביתה – לקיבוץ גונן. כאן כל מתאמן מקבל יחס אישי, ואף אחד לא נשאר מאחור.
