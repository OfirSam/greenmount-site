eyebrow: איך מתחילים
title: "שלושה צעדים **לאימון הראשון**"
intro: כל דרך מתחילה בצעד הראשון – והוא פשוט יותר ממה שנדמה.
# icon: phone | groups | trial
steps:
  - title: משאירים פרטים
    text: בטופס או בוואטסאפ – לוקח פחות מדקה.
    icon: phone
  - title: מתאימים לכם קבוצה
    text: לפי גיל, ניסיון ומה שמעניין אתכם – ושולחים לכם את הימים והשעות.
    icon: groups
  - title: באים לאימון ניסיון
    text: ללא התחייבות. לא צריך ציוד – בגדי ספורט נוחים מספיקים.
    icon: trial
