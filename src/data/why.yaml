# "למה דווקא GREENMOUNT?" – 5 הסיבות מהאתר הקיים
- title: יחס אישי
  text: כל מתאמן מקבל תשומת לב אמיתית. אנחנו מכירים אתכם בשמות.
- title: צוות מקצועי
  text: מאמנים מנוסים עם רקע עמוק בתחומם וחיבה אמיתית לאנשים שמולם.
- title: אווירה משפחתית
  text: בא לבד ויוצא עם חברים. זה מה שקורה פה.
- title: תהליך, לא רק אימון
  text: אנחנו מאמינים בהתקדמות איטית ואמיתית. לא בקיצורי דרך.
- title: מקום לגדול בו
  text: בגוף, בביטחון ובדרך. הגענו לכאן בשביל לגדול יחד.
